# 持续集成：重新生成代码、检查工作区一致性，并验证协议、后端和前端均可构建。
name: CI

# 支持手动运行，并在主分支、版本标签和面向主分支的 PR 上自动执行。
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  # 工作流只需读取仓库内容，不授予写入权限。
  contents: read

jobs:
  verify:
    name: Generate, test and build
    runs-on: ubuntu-latest
    steps:
      # 拉取完整项目源码。
      - name: Checkout
        uses: actions/checkout@v4

      # Go 版本与 go.mod 保持一致，并启用依赖缓存。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true

      # Buf 负责编译、校验和生成 Proto 相关文件。
      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.72.0'
          github_token: ${{ github.token }}

      # 前端构建使用 Node.js 20 和 pnpm 9。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      # 安装与本地 Makefile 对应的代码生成器版本。
      - name: Install generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install github.com/go-kratos/kratos/cmd/protoc-gen-go-http/v2@v2.9.2
          go install github.com/google/gnostic/cmd/protoc-gen-openapi@v0.7.1
          go install github.com/menta2k/protoc-gen-redact/v3@v3.0.0-20260213125431-7688a38967d4
          go install github.com/go-kratos/protoc-gen-typescript-http@latest

      # 锁文件必须与依赖声明一致，CI 不允许自动改写。
      - name: Install frontend dependencies
        working-directory: frontend/admin
        run: pnpm install --frozen-lockfile

      # 重新生成所有派生文件，随后确认仓库中已提交的生成物没有漂移。
      - name: Generate
        run: make gen

      - name: Verify generated files
        run: git diff --exit-code

      # 依次执行协议检查、Go 测试、前端构建和服务端构建。
      - name: Lint Proto
        run: make api-lint

      - name: Test Go
        run: make test

      - name: Build frontend
        run: make frontend-build

      - name: Build server
        run: make build-server

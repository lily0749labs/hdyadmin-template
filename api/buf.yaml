# hdyadmin 模块协议。版本保留在 Proto 包名和文件名中。
version: v2

modules:
  - path: protos

deps:
  - buf.build/googleapis/googleapis
  - buf.build/bufbuild/protovalidate

lint:
  use:
    - STANDARD
  except:
    # domain/example_v1.proto 对应 domain.example.v1。
    - DIRECTORY_SAME_PACKAGE
    - PACKAGE_DIRECTORY_MATCH
    - FIELD_NOT_REQUIRED

breaking:
  use:
    - FILE

# 生成 Go Protobuf、gRPC、Kratos HTTP 和日志脱敏代码。
version: v2

clean: true

managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package
      path: domain
      value: github.com/neo-fork-gotangra/hdyadmin-template/pb/domain;domain_pb

plugins:
  - local: protoc-gen-go
    out: ../pb
    opt:
      - paths=import
      - module=github.com/neo-fork-gotangra/hdyadmin-template/pb

  - local: protoc-gen-go-grpc
    out: ../pb
    opt:
      - paths=import
      - module=github.com/neo-fork-gotangra/hdyadmin-template/pb

  - local: protoc-gen-go-http
    out: ../pb
    opt:
      - paths=import
      - module=github.com/neo-fork-gotangra/hdyadmin-template/pb

  - local: [go, run, ./tools/protoc-gen-redact]
    out: ../pb
    strategy: all
    opt:
      - paths=import
      - module=github.com/neo-fork-gotangra/hdyadmin-template/pb
      - lang=go

inputs:
  - directory: protos

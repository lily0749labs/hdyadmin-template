# 根据 google.api.http 注解生成模块注册使用的 OpenAPI 文档。
version: v2

clean: false

managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package
      path: domain
      value: github.com/neo-fork-gotangra/hdyadmin-template/api/pb/domain;domain_pb

plugins:
  - local: protoc-gen-openapi
    strategy: all
    out: ../app/cmd/server/assets
    opt:
      - title=hdyadmin Template API
      - description=Starter API for an hdyadmin business module
      - version=1.0.0
      - naming=json
      - depth=2
      - default_response=false
      - enum_type=string
      - output_mode=merged
      - fq_schema_naming=false

inputs:
  - directory: protos
